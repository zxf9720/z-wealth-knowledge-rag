server:
  port: 8081

# virtual threads
  threads:
    virtual:
      enabled: true

# logging
logging:
  file:
    path: logs
  level:
    org.springframework.ai: DEBUG
    org.springframework.web: INFO
    org.springframework.web.client: DEBUG
    root: INFO

# actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans
  endpoint:
    health:
      show-details: always

# spring doc - swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
#    enabled: false  -- disable on prod
  api-docs:
    path: /v3/api-docs
#    enabled: false  -- disable on prod
#  show-actuator: true


services:
  customer-data:
    base-url: http://localhost:8082
  compliance-review:
    base-url: http://localhost:8083

