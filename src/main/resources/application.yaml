spring:
  application:
    name: z-wealth-knowledge-rag
  profiles:
    active: dev

  ai:
    model:
      chat: ollama

    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: gemma4
      embedding:
        options:
          model: nomic-embed-text
    mcp:
      client:
        enabled: true
        toolcallback:
          enabled: true
        sse:
          connections:
            market-rate-server:
              url: http://localhost:8084

    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: wealth-rag
        initialize-schema: true

  ##### start using postgresql vector DB #####
